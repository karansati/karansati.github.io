<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Honeycomb Portrait Frame</title>
<style>
/* --- Core Styling & Background --- */
body {
margin: 0;
padding: 0;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
background: linear-gradient(135deg, #0d1117, #1c2128); /* Match dark professional tone */
overflow: hidden; /* For dynamic border effects */
}

/* --- Outer Dynamic Container & Boundary --- */
.portrait-stage {
position: relative;
width: 60vmin; /* Responsive width */
height: 60vmin;
padding: 3vmin; /* Spacing between border and stage */
box-sizing: border-box;
}

/* Base Dynamic Boundary Style (Irregular Hexagonal Base) */
.stage-inner {
position: relative;
width: 100%;
height: 100%;
overflow: hidden; /* Contain the image within the base shape */
clip-path: polygon( /* Custom irregular hexagonal base shape */
10% 0%, 90% 0%, 100% 10%, 100% 90%, 90% 100%,
10% 100%, 0% 90%, 0% 10%
);
background-color: transparent; /* No fill on inner stage, let border define shape */
}

/* --- Reframed Portrait Image (Provided by User) --- */
.portrait-image {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
width: 100%; /* Cover the inner stage area, preserving aspect ratio */
height: auto;
min-height: 100%; /* Ensure full height cover in case image is portrait */
opacity: 1;
transition: opacity 1s ease-in-out; /* Smooth transition for potentially wider image appearance */
display: block; /* Avoid inline spacing issues */
z-index: -1; /* Place image behind any potentially overlapping animated elements */
}

/* --- Animated Honeycomb Border Layer --- */
.honeycomb-border {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: 10; /* Place border element *over* image */
pointer-events: none; /* Let clicks pass through border */
}

/* --- Dynamic Honeycomb Grid (SVG for control/animation) --- */
.honeycomb-grid {
width: 100%;
height: 100%;
fill: none; /* No base fill, let cells define appearance */
}

/* Styles for animated honeycomb cells (JavaScript dynamically generates and updates these) */
.hex-cell {
stroke-width: 1; /* Thin border for clean look */
fill-opacity: 0.1; /* Translucent cells */
transition: fill 0.3s ease, stroke 0.3s ease; /* Smooth state transitions */
}
</style>
</head>
<body>

<div class="portrait-stage">
<div class="stage-inner">
<img src="karan.jpg" alt="Reframed Professional Portrait" class="portrait-image" id="portraitImg">
</div>

<div class="honeycomb-border" id="borderStage">
<svg class="honeycomb-grid" viewBox="0 0 100 100" id="hexGrid">
</svg>
</div>
</div>

<script>
// --- Configuration for Dynamic Honeycomb Grid ---
const gridConfig = {
cols: 10, // Number of columns
rows: 10, // Number of rows
hexSize: 10, // Approximate diameter of each hex cell relative to viewBox size
baseColor: { r: 100, g: 150, b: 200, a: 0.3 }, // Soft base translucent color (soft blue)
activeColor: { r: 250, g: 200, b: 100, a: 0.8 }, // Vibrant active color (electric gold)
pulseRate: 0.05, // Rate of pulsing color changes
maxBrightnessShift: 50, // Max brightness fluctuation
activeProbability: 0.1, // Probability a cell is active in a given pulse cycle
cellAnimationInterval: 500, // Interval between cell animation updates (ms)
};

const hexGrid = document.getElementById('hexGrid');
const borderStage = document.getElementById('borderStage');
const portraitImg = document.getElementById('portraitImg');

// --- Helper Functions for Color Manipulation (Simplified, no named colors) ---
function getRGBAString(color, alphaOverride) {
return `rgba(${color.r}, ${color.g}, ${color.b}, ${alphaOverride !== undefined ? alphaOverride : color.a})`;
}

function shiftBrightness(color, shiftPercentage) {
const shiftAmount = (gridConfig.maxBrightnessShift / 100) * 255 * (shiftPercentage / 100);
const r = Math.max(0, Math.min(255, color.r + shiftAmount));
const g = Math.max(0, Math.min(255, color.g + shiftAmount));
const b = Math.max(0, Math.min(255, color.b + shiftAmount));
return { r, g, b, a: color.a };
}

// --- Hexagonal Drawing Constants ---
const hexHeight = Math.sqrt(3); // Height factor relative to column width
const colWidth = 1.5 * gridConfig.hexSize;
const rowHeight = hexHeight * gridConfig.hexSize;

// --- Generate & Animate Honeycomb Grid (SVG based) ---
function createHexCell(x, y, scale) {
// Point generation for a hexagon relative to its center (approximate, adapted for grid)
const points = [];
const angles = [30, 90, 150, 210, 270, 330]; // Relative angles for hexagonal vertices
for (let angle of angles) {
const angleRad = (angle * Math.PI) / 180;
points.push(`${scale * Math.cos(angleRad)},${scale * Math.sin(angleRad)}`);
}

const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
polygon.setAttribute("points", points.join(' '));
polygon.setAttribute("class", "hex-cell");
polygon.setAttribute("transform", `translate(${x}, ${y})`);
polygon.style.stroke = getRGBAString(gridConfig.baseColor);
polygon.style.fill = getRGBAString(gridConfig.baseColor);
return polygon;
}

function drawGrid() {
// Clear any existing grid content
hexGrid.innerHTML = '';
// Dynamic irregular hexagonal boundary *roughly* matches outer container boundary conceptually
const path = `M10 0 L90 0 L100 10 L100 90 L90 100 L10 100 L0 90 L0 10 Z`;
const borderClipPath = document.createElementNS("http://www.w3.org/2000/svg", "clipPath");
borderClipPath.setAttribute("id", "borderShape");
const borderPathElement = document.createElementNS("http://www.w3.org/2000/svg", "path");
borderPathElement.setAttribute("d", path);
borderClipPath.appendChild(borderPathElement);
hexGrid.appendChild(borderClipPath);
hexGrid.setAttribute("clip-path", "url(#borderShape)"); // Apply clipping to whole SVG stage


for (let row = 0; row < gridConfig.rows; row++) {
for (let col = 0; col < gridConfig.cols; col++) {
const offsetX = (row % 2 === 0) ? gridConfig.hexSize * 0.75 : 0;
const x = (col * colWidth) + offsetX;
const y = (row * rowHeight) / 2;

const hexScale = (gridConfig.hexSize / 2) * 1.1; // Slighting larger than radius for seamless connections
const hexCell = createHexCell(x, y, hexScale);
hexGrid.appendChild(hexCell);
}
}
}

let pulseCounter = 0;
const allCells = [];

function animateGrid() {
pulseCounter += gridConfig.pulseRate;
// Get all cells once on update
if (allCells.length === 0) {
document.querySelectorAll('.hex-cell').forEach(cell => allCells.push(cell));
}

allCells.forEach((cell, index) => {
// Soft brightness pulse animation over time
const brightnessShift = 100 * Math.sin(pulseCounter + index * 0.1) * (gridConfig.pulseRate / 2); // Control pulse with shift & prob.
const dimmedColor = shiftBrightness(gridConfig.baseColor, brightnessShift); // Shift base translucency softly
cell.style.stroke = getRGBAString(dimmedColor, 0.4); // Use soft base for dimmed state stroke
cell.style.fill = getRGBAString(dimmedColor); // trans. fill for dimmed state

// Randomly activate some cells more dynamically
if (Math.random() < gridConfig.pulseRate * gridConfig.activeProbability) {
const isActive = Math.random() < gridConfig.activeProbability;
if (isActive) {
cell.style.fill = getRGBAString(gridConfig.activeColor); // Highlight dynamic active cells with vibrant gold translucency
cell.style.stroke = getRGBAString(gridConfig.activeColor, 0.9); // Highlight stroke as well
}
}
});
}

// Draw the initial grid, then start animation loop
drawGrid();
setInterval(animateGrid, gridConfig.cellAnimationInterval); // Animation update interval
</script>

</body>
</html>
